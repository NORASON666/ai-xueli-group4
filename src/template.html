<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用 AI 讀懂學力檢測｜第四群組教務主任增能研習</title>
<meta name="description" content="用 AI 讀懂學力檢測，找出學校的改變方向。第四群組教務主任增能研習：AI 基本功、ChatGPT 桌面版、十四則指令、範例資料代碼、講稿、補充資料與學校改變方向卡。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=LXGW+WenKai+TC:wght@400;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1E3A6E; --ink:#22314d; --blue:#3B82C4; --sky:#5AA9E6; --pale:#DCEEFB; --paper:#FBFDFF;
  --orange:#F0A23B; --soft:#F3F7FB; --line:#C9D9EA; --muted:#5d6b80;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E9EFF6;color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#deck{width:1920px;height:1080px;position:relative;transform-origin:center center;flex:none}
.slide{position:absolute;inset:0;background:var(--paper);display:none;overflow:hidden;
  background-image:radial-gradient(circle at 1px 1px,#e3ecf6 1px,transparent 0);background-size:28px 28px}
.slide.on{display:block}
.slide:not(.t-cover):not(.t-closing):not(.t-divider)::after{content:"";position:absolute;right:60px;top:36px;width:360px;height:160px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='160'><path d='M10 140 C 90 150 120 60 200 90 S 280 40 300 40' fill='none' stroke='%235AA9E6' stroke-width='3' stroke-dasharray='8 9'/><path d='M300 40 l52 -24 -18 50 -12 -16 z' fill='white' stroke='%231E3A6E' stroke-width='3' stroke-linejoin='round'/></svg>") no-repeat;opacity:.7;pointer-events:none}
.slide::before{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:linear-gradient(90deg,var(--sky),var(--pale) 60%,var(--orange))}
.inner{position:absolute;inset:70px 120px 70px 120px;display:flex;flex-direction:column}
.pno{position:absolute;right:40px;bottom:30px;font:600 30px Caveat,cursive;color:var(--blue)}
.kicker{font:700 30px "LXGW WenKai TC",serif;color:var(--blue);letter-spacing:.06em;margin-bottom:6px}
.kicker::before{content:"✎ ";color:var(--orange)}
.kicker.big{font-size:44px}
.title{margin:0 0 40px;font-weight:900;font-size:76px;color:var(--navy);line-height:1.15}
.title span{background:linear-gradient(transparent 62%,var(--pale) 62%);padding:0 10px;
  border-bottom:6px solid var(--orange);border-radius:0 0 40px 6px/0 0 10px 4px}
.foot{font-size:38px;font-weight:700;color:var(--navy);margin:28px 0 0;padding:14px 24px;background:#FFF6E6;border-left:10px solid var(--orange);border-radius:6px}
.src{position:absolute;left:0;bottom:-34px;margin:0;font-size:22px;color:var(--muted)}
.link{font-size:32px;color:var(--blue);margin-top:20px;font-weight:700}
mark{background:linear-gradient(transparent 55%,var(--pale) 55%);color:inherit}
/* 封面 */
.cover{position:absolute;inset:-70px -120px;display:flex;align-items:center;justify-content:center}
.cover .ill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover-text{position:relative;text-align:center;background:rgba(251,253,255,.82);padding:40px 70px;border-radius:40px;box-shadow:0 0 60px 30px rgba(251,253,255,.85)}
.cover .org{font:700 34px "LXGW WenKai TC",serif;color:var(--blue)}
.cover h1{font-weight:900;font-size:112px;line-height:1.15;color:var(--navy);margin:18px 0}
.cover h1 mark{border-bottom:8px solid var(--orange)}
.cover .meta{font-size:40px;font-weight:700;color:var(--ink)}
.cover .who{margin-top:26px;display:flex;gap:40px;justify-content:center;font-size:36px}
.cover .who b{font:700 46px "LXGW WenKai TC",serif;color:#B5462E}
.cover .hand{font:600 80px Caveat,cursive;color:var(--blue)}
/* 章節頁 */
.divider{display:flex;align-items:center;height:100%;gap:60px}
.dv-text{flex:1}
.dv-title{font-weight:900;font-size:130px;color:var(--navy);margin:10px 0;line-height:1.1}
.dv-sub{font:700 60px "LXGW WenKai TC",serif;color:var(--ink);border-bottom:8px solid var(--orange);display:inline-block;padding-bottom:6px}
.dv-ill{width:760px;height:760px;flex:none}
.dv-ill .ill{width:100%;height:100%;object-fit:contain}
/* 條列 */
.bul{margin:auto 0;padding-left:1.2em;font-size:50px;line-height:1.55}
.bul li{margin:8px 0}
.bul li::marker{color:var(--orange)}
.bul li.hl{font-weight:700;color:var(--navy)}
ol.bul li::marker{font-weight:900;color:var(--blue)}
/* 卡片：手繪框 */
.cards{display:grid;gap:34px;flex:1;align-content:center}
.c2{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}.c5{grid-template-columns:repeat(5,1fr)}.c5 .card h3{font-size:34px}.c5 .card p{font-size:28px}.c1{grid-template-columns:1fr}
.card{position:relative;background:#fff;border:3px solid var(--navy);padding:30px 34px;
  border-radius:255px 18px 225px 18px/18px 225px 18px 255px;box-shadow:8px 10px 0 var(--pale)}
.card h3{margin:0 0 14px;font-size:44px;font-weight:900;color:var(--navy)}
.card p{margin:0;font-size:36px;line-height:1.5}
.card .note{margin-top:18px;font:700 30px "LXGW WenKai TC",serif;color:#B5462E}
.card .num{width:64px;height:64px;border-radius:50%;background:var(--orange);color:#fff;font:900 38px/64px "Noto Sans TC";text-align:center;margin-bottom:14px}
.arrows .card:not(:last-child)::after{content:"➜";position:absolute;right:-36px;top:46%;font-size:40px;color:var(--orange)}
.rd1{background:#F1F8FE}
.stat .big{font:900 92px "Noto Sans TC";color:var(--blue);line-height:1.1;margin-bottom:10px}
/* 步驟 */
.steps{list-style:none;margin:auto 0;padding:0;display:flex;flex-direction:column;gap:34px}
.steps li{display:flex;align-items:center;gap:30px;font-size:50px;font-weight:700;color:var(--navy);background:#fff;
  border:3px solid var(--navy);padding:22px 34px;border-radius:18px 255px 18px 225px/225px 18px 255px 18px;box-shadow:8px 10px 0 var(--pale)}
.steps .num{flex:none;width:80px;height:80px;border-radius:50%;background:var(--sky);color:#fff;font:900 46px/80px "Noto Sans TC";text-align:center}
.qs li{font-weight:500;font-size:44px;color:var(--ink)}
.qs .num:empty{display:none}
.situation{font-size:52px;font-weight:900;color:var(--navy);margin:16px 0 40px;line-height:1.4}
.situation .tag{display:inline-block;font-size:30px;background:var(--orange);color:#fff;border-radius:12px;padding:4px 18px;margin-right:18px;vertical-align:middle}
/* 表格 */
.tbl{margin:auto 0;border-collapse:separate;border-spacing:0;width:100%;font-size:40px;background:#fff;border:3px solid var(--navy);border-radius:20px;overflow:hidden}
.tbl th{background:var(--navy);color:#fff;padding:22px;font-size:42px}
.tbl td{padding:26px 22px;border-top:2px dashed var(--line);text-align:center;height:110px}
.tbl.compact td{height:auto;padding:7px 22px;font-size:32px}.tbl.compact th{padding:12px}
.tbl td:first-child{white-space:nowrap;font-weight:700;color:var(--navy)}
.tbl th:nth-child(3),.tbl td:nth-child(3){background:#FFF8EC}
.tbl th:nth-child(3){background:#B9741C}
/* 圖片 */
.shot{flex:1;display:flex;justify-content:center;align-items:center;min-height:0;gap:40px}
.shot img{height:100%;width:auto;max-width:100%;object-fit:contain;border:3px solid var(--navy);border-radius:14px;box-shadow:12px 14px 0 var(--pale);background:#fff}
.shot.two img{max-width:48%}
.shot.three img{max-width:31%}
.prompt{position:relative;flex:1;min-height:0;margin:0}.prompt.code pre{margin:0;height:100%;max-height:none;overflow:auto;white-space:pre-wrap;background:#fff;border:3px solid var(--navy);border-radius:20px;padding:30px 40px;font:500 33px/1.55 'Noto Sans TC';color:var(--ink);box-shadow:12px 14px 0 var(--pale)}
.prompt.code.small pre{font-size:23px;line-height:1.42;padding:20px 36px}
.prompt.code.big pre{font-size:44px;line-height:1.6;padding:40px 150px 40px 50px}
.steps.compact{gap:18px}.steps.compact li{font-size:38px;padding-top:14px;padding-bottom:14px}.steps.compact .num{width:64px;height:64px;font-size:36px;line-height:64px}
.prompt.code .copy{font-size:26px;padding:8px 22px;right:20px;top:20px;border-radius:20px}
.dls{display:flex;flex-wrap:wrap;gap:24px;margin-top:20px}
.st{display:flex;gap:60px;flex:1;min-height:0;align-items:center}
.st-img{flex:1.15;display:flex;justify-content:center;min-height:0;height:100%;align-items:center}
.st-img img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 2px #1E3A6E) drop-shadow(12px 14px 0 #DCEEFB)}
.st-text{flex:1}
.st-text p{font-size:42px;line-height:1.6;margin:0 0 28px}
.st-text p b{color:#B5462E}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ill{mix-blend-mode:multiply}
.illus{flex:1;min-height:0;display:flex;justify-content:center}
.illus .ill{height:100%;max-width:100%;object-fit:contain;border-radius:24px}
.ill.missing{display:flex;align-items:center;justify-content:center;border:4px dashed var(--line);color:var(--muted);font-size:40px;width:70%;border-radius:30px}
.quote{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;margin:0;font:700 72px/1.55 "LXGW WenKai TC",serif;color:var(--navy)}
.quote.q2{flex:none;font-size:64px;margin:20px 0 40px}
.rel{margin-top:26px;display:flex;align-items:center;gap:22px;font:900 44px 'Noto Sans TC';color:var(--navy)}.rel .tag{flex:none;font:700 28px 'Noto Sans TC';color:#fff;background:var(--sky);border-radius:30px;padding:8px 22px}
.aiday{display:flex;gap:60px;align-items:center;flex:1}
.aiday .bul{flex:1;font-size:44px}
.qr{width:420px;border:3px solid var(--navy);border-radius:14px;background:#fff;padding:10px}
.srcs{display:grid;grid-template-columns:1fr 1fr;gap:40px;font-size:31px;line-height:1.6}
.srcs ul{margin:0;padding-left:1em}
/* 本場版面：保留大字，補充說明留在側欄 */
.cover .subtitle{font:700 68px "LXGW WenKai TC",serif;margin:24px 0 54px}
.cover .who{font-size:34px}
.dv-title{font-size:116px}
.dv-sub{font-size:50px}
.tbl.compact th{font-size:36px}
.tbl tbody tr:nth-child(even) td{background:#F0F6FC}
.tbl tbody tr:nth-child(even) td:nth-child(3){background:#FFF2DB}
.card{border-width:2px;box-shadow:8px 10px 0 var(--pale),0 16px 28px #1e3a6e0a}
.upload{align-items:stretch;padding:48px 0}
.upload .card{padding:30px 28px;border-radius:24px;border-top:10px solid #43846B}
.upload .card:nth-child(2){border-top-color:var(--orange);background:#FFFBF2}
.upload .card:nth-child(3){border-top-color:#B5462E;background:#FFF6F3}
.upload .card h3{font-size:40px;margin-bottom:28px}
.upload .card p{font-size:36px;line-height:1.8}
.st-text p{font-size:52px;font-weight:700;border-left:8px solid var(--orange);padding-left:26px}
.t-shot2 .title{font-size:68px}
.dv-text{min-width:0}
.dv-ill{width:700px;height:700px}
.dv-ill .ill.missing{width:100%}
.cover .ill.missing{width:100%;align-items:flex-end;padding-bottom:38px;background:linear-gradient(135deg,#DCEEFB,#FBFDFF 50%,#FFF1DC);font-size:28px}
/* 八段時間軸：分鐘數為主要視覺 */
.timeline{list-style:none;padding:0;margin:auto 0;display:grid;grid-template-columns:repeat(8,1fr);gap:18px}
.timeline li{position:relative;background:#fff;border:2px solid var(--line);border-top:8px solid var(--sky);border-radius:20px;padding:24px 16px;box-shadow:0 10px 0 var(--pale)}
.timeline li:nth-child(3),.timeline li:nth-child(6){border-top-color:var(--orange);background:#FFFAF0}
.route-no{font:700 32px Caveat,cursive;color:var(--blue)}
.timeline h3{font-size:34px;color:var(--navy);margin:20px 0;white-space:nowrap}
.minutes{font-size:82px;line-height:1.1;font-weight:900;color:var(--navy)}
.minutes small{display:block;font-size:26px;font-weight:500;margin-top:8px;color:var(--muted)}
.timeline p{font-size:28px;line-height:1.6;margin:30px 0 0;color:var(--ink)}
.timeline li:not(:last-child)::after{content:"›";position:absolute;right:-19px;top:48%;z-index:1;color:var(--blue);font-size:42px}
.time-track{display:flex;gap:6px;height:18px;margin-top:32px;border-radius:9px;overflow:hidden}
.time-track span{background:var(--sky)}
.time-track span:nth-child(3),.time-track span:nth-child(6){background:var(--orange)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid var(--orange);outline-offset:4px}
/* 補充按鈕 */
.supbtn{position:absolute;right:110px;bottom:24px;font:700 28px "Noto Sans TC";color:#fff;background:var(--blue);border:none;border-radius:30px;padding:10px 26px;cursor:pointer;box-shadow:0 4px 0 var(--navy)}
.supbtn:hover{background:var(--navy)}
/* 側欄（補充／講稿） */
#panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,92vw);background:#fff;box-shadow:-8px 0 30px rgba(30,58,110,.18);transform:translateX(102%);transition:transform .25s;z-index:20;display:flex;flex-direction:column}
#panel.open{transform:none}
#panel header{display:flex;gap:8px;padding:14px 16px;border-bottom:2px solid var(--pale);align-items:center}
#panel header button{font:700 16px "Noto Sans TC";border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:20px;padding:6px 14px;cursor:pointer}
#panel header button.act{background:var(--navy);color:#fff}
#panel header .x{margin-left:auto;border:none;font-size:22px}
#pbody{overflow:auto;padding:18px 20px 40px;font-size:17px;line-height:1.7}
#pbody .notes{white-space:pre-wrap}
.sup{border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.sup h4{margin:6px 0 8px;font-size:19px;color:var(--navy)}
.sup ul,.sup ol{margin:0;padding-left:1.3em}
.sup-k{display:flex;gap:8px;font-size:13px}
.kind{background:var(--pale);color:var(--navy);border-radius:8px;padding:1px 8px;font-weight:700}
.ev{border-radius:8px;padding:1px 8px;background:#eef1f5;color:var(--muted)}
.ev-AI\ 生成待查證{background:#FFF1DC;color:#9A5B10}
.rd{margin-top:10px}.rd summary{font-weight:700;color:var(--navy);cursor:pointer}.rd p{margin:8px 0;text-indent:0}
.lm{margin-top:10px;background:#FFF6E6;border-radius:10px;padding:8px 12px}.lm ul{margin:4px 0 0}
.tk{margin-top:10px;border-left:4px solid var(--sky);padding:4px 12px}.tk p{margin:4px 0}
#panel{width:min(640px,94vw)!important}
.cl{margin-top:10px;background:#F1F8FE;border-radius:10px;padding:8px 12px}
.sup-src{margin:10px 0 0;font-size:14px;color:var(--muted)}
.empty{color:var(--muted)}
.code{position:relative;margin-top:10px}.code pre{white-space:pre-wrap;background:#F3F7FB;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;line-height:1.6;max-height:420px;overflow:auto}
.copy{position:absolute;right:8px;top:8px;font:700 13px 'Noto Sans TC';background:var(--navy);color:#fff;border:none;border-radius:12px;padding:4px 10px;cursor:pointer}
.dl.big{font-size:34px;padding:14px 30px;border-radius:30px;align-self:flex-start;margin-top:10px}
.dl{display:inline-block;background:var(--orange);color:#fff;font-weight:700;border-radius:14px;padding:6px 14px;text-decoration:none}
.shot.two figure{margin:0;flex:1;display:flex;flex-direction:column;align-items:center;height:100%;min-height:0}.shot.two figure img{max-width:100%;flex:1;min-height:0}.shot.two figcaption{font:900 40px 'Noto Sans TC';margin-top:14px}
/* 控制列 */
#bar-zone{position:fixed;left:0;right:0;top:0;height:76px;z-index:10}
#bar{position:absolute;left:50%;top:6px;transform:translateX(-50%) scale(.82);transform-origin:top center;opacity:.25;transition:opacity .2s,transform .2s;display:flex;gap:8px;padding:6px;background:rgba(255,255,255,.95);border:2px solid var(--navy);border-radius:24px;box-shadow:0 4px 14px rgba(30,58,110,.25);white-space:nowrap}
#bar-zone:hover #bar,#bar:focus-within{opacity:1;transform:translateX(-50%) scale(1)}
#bar button{font:700 16px "Noto Sans TC";border:none;background:var(--navy);color:#fff;border-radius:16px;padding:8px 14px;cursor:pointer}
#bar button:hover{background:var(--orange)}
#prog{position:fixed;left:0;top:0;height:4px;background:var(--orange);z-index:10;transition:width .2s}
/* 總覽 */
#grid{position:fixed;inset:0;background:rgba(233,239,246,.97);z-index:30;overflow:auto;display:none;padding:24px}
#grid.open{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;align-content:start}
#grid button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px;text-align:left;cursor:pointer;font:500 14px "Noto Sans TC";color:var(--ink);min-height:70px}
#grid button b{color:var(--blue);margin-right:6px}
#grid button.has::after{content:" 📎";}

/* LINE QR 頁 */
.qrpage{flex:1;display:flex;align-items:center;justify-content:center;gap:90px}
.qrpage img{height:640px;border:4px solid var(--navy);border-radius:24px;background:#fff;padding:14px;box-shadow:14px 16px 0 var(--pale)}
.qrpage .bul{flex:none;font-size:52px}
/* QR 彈窗 */
#qrModal{position:fixed;inset:0;background:rgba(20,35,65,.72);z-index:40;display:none;align-items:center;justify-content:center}
#qrModal.open{display:flex}
#qrModal .box{background:#fff;border:2px solid var(--navy);border-radius:28px;padding:28px 34px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#qrModal img{width:min(70vh,80vw);height:min(70vh,80vw);display:block}
#qrModal .cap{font:900 clamp(20px,3vh,34px) 'Noto Sans TC';color:var(--navy);margin-top:12px}
#qrModal .hint{font-size:14px;color:var(--muted);margin-top:4px}
/* 計時器面板 */
#timerPanel{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:35;background:#fff;border:2px solid var(--navy);border-radius:20px;box-shadow:0 10px 30px rgba(30,58,110,.25);padding:16px 18px;display:none;font-family:'Noto Sans TC';width:min(440px,94vw)}
#timerPanel.open{display:block}
#timerPanel h5{margin:0 0 10px;font-size:18px;color:var(--navy)}
#timerPanel .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
#timerPanel input{width:70px;font:700 22px 'Noto Sans TC';text-align:center;border:2px solid var(--line);border-radius:10px;padding:4px}
#timerPanel button{font:700 15px 'Noto Sans TC';border:none;background:var(--navy);color:#fff;border-radius:14px;padding:7px 12px;cursor:pointer}
#timerPanel button.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
#timerPanel button.go{background:var(--orange)}
#timerPanel label{font-size:14px;color:var(--ink);display:flex;align-items:center;gap:4px}
/* 浮動倒數顯示（換頁不影響） */
#timerBadge{position:fixed;right:18px;top:12px;z-index:36;display:none;align-items:center;gap:10px;background:#fff;border:3px solid var(--navy);border-radius:22px;padding:6px 16px;font:900 34px 'Noto Sans TC';color:var(--navy);box-shadow:0 6px 18px rgba(30,58,110,.25);cursor:pointer;font-variant-numeric:tabular-nums}
#timerBadge.show{display:flex}
#timerBadge.paused{opacity:.6}
#timerBadge.warn{background:#FFF1DC;border-color:var(--orange);color:#B5462E}
#timerBadge.danger{background:#E5484D;border-color:#B42318;color:#fff;animation:pulse 1s infinite}
#timerBadge .bar{width:80px;height:8px;background:var(--pale);border-radius:4px;overflow:hidden}
#timerBadge .bar i{display:block;height:100%;background:var(--sky)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
#edgeGlow{position:fixed;inset:0;pointer-events:none;z-index:34;box-shadow:inset 0 0 0 0 rgba(229,72,77,0);transition:box-shadow .3s}
#edgeGlow.on{animation:glow 1s infinite}
@keyframes glow{0%,100%{box-shadow:inset 0 0 30px 6px rgba(229,72,77,.35)}50%{box-shadow:inset 0 0 80px 22px rgba(229,72,77,.7)}}
#timesUp{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;background:rgba(229,72,77,.88);font:900 min(18vw,220px) 'Noto Sans TC';color:#fff;cursor:pointer;animation:flash .6s 5}
#timesUp.open{display:flex}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.55}}
@media print{#qrModal,#timerPanel,#timerBadge,#edgeGlow,#timesUp{display:none!important}#bar-zone,#panel,#prog,.supbtn{display:none}}
</style>
</head>
<body>
<div id="prog"></div>
<div id="stage"><div id="deck">
<!--SLIDES-->
</div></div>
<aside id="panel" aria-label="補充資料與講稿"><header>
<button data-tab="sup" class="act">📎 補充資料</button><button data-tab="notes">🗒 講稿</button>
<button class="x" aria-label="關閉">✕</button></header><div id="pbody"></div></aside>
<div id="grid"></div>

<div id="qrModal" role="dialog" aria-label="研習 LINE 群組 QR"><div class="box"><img src="assets/shots/line_group_qr.jpg" alt="LINE 群組 QR Code"><div class="cap">掃描加入研習 LINE 群組</div><div class="hint">點任意處或按 Q／Esc 關閉</div></div></div>
<div id="timerPanel" aria-label="倒數計時">
 <h5>⏱ 倒數計時</h5>
 <div class="row"><input id="tMin" type="number" min="0" max="180" value="5"> 分 <input id="tSec" type="number" min="0" max="59" value="0"> 秒</div>
 <div class="row"><button class="ghost" data-p="60">1 分</button><button class="ghost" data-p="180">3 分</button><button class="ghost" data-p="300">5 分</button><button class="ghost" data-p="600">10 分</button><button class="ghost" data-p="900">15 分</button></div>
 <div class="row"><button class="go" id="tStart">開始</button><button id="tPause">暫停／繼續</button><button class="ghost" id="tAdd">+1 分</button><button class="ghost" id="tReset">結束</button></div>
 <div class="row"><label><input type="checkbox" id="tTick" checked> 每秒滴答聲</label><label><input type="checkbox" id="tWarnSnd" checked> 最後 10 秒提示音樂</label></div>
</div>
<div id="timerBadge" title="點一下打開計時設定"><span id="tLeft">05:00</span><span class="bar"><i id="tBar"></i></span></div>
<div id="edgeGlow"></div>
<div id="timesUp">時間到！</div>
<div id="bar-zone"><nav id="bar" aria-label="簡報工具列"><button id="bPrev">◀</button><button id="bQR">QR Q</button><button id="bTimer">⏱ 計時 T</button><button id="bGrid">總覽 O</button><button id="bSup">補充 S</button><button id="bNotes">講稿 N</button><button id="bFull">全螢幕 F</button><button id="bNext">▶</button></nav></div>
<script>
const SIDE=/*SIDE*/[];
const slides=[...document.querySelectorAll('.slide')];
let cur=0, tab='sup';
const panel=document.getElementById('panel'), pbody=document.getElementById('pbody');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById('deck').style.transform=`scale(${s})`;}
function show(i){cur=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,k)=>s.classList.toggle('on',k===cur));
  history.replaceState(null,'','#p'+slides[cur].dataset.label);document.getElementById('prog').style.width=((cur+1)/slides.length*100)+'%';renderPanel();}
function renderPanel(){const d=SIDE[cur];setTimeout(bindCopy,0);
  document.querySelectorAll('#panel header [data-tab]').forEach(b=>b.classList.toggle('act',b.dataset.tab===tab));
  if(tab==='sup') pbody.innerHTML=d.sup||'<p class="empty">這頁沒有補充資料。</p>';
  else if(d.notes){pbody.innerHTML='<div class="notes"></div>';pbody.firstChild.textContent=d.notes;}
  else pbody.innerHTML='<p class="empty">這頁沒有講稿。</p>';}
document.querySelectorAll('.slide .copy').forEach(b=>b.onclick=ev=>{ev.stopPropagation();navigator.clipboard.writeText(b.nextElementSibling.textContent);b.textContent='已複製';setTimeout(()=>b.textContent='複製',1500);});
function bindCopy(){pbody.querySelectorAll('.copy').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.nextElementSibling.textContent);b.textContent='已複製';setTimeout(()=>b.textContent='複製',1500);});}
function openPanel(t){if(panel.classList.contains('open')&&tab===t){panel.classList.remove('open');return;}tab=t;panel.classList.add('open');renderPanel();}
document.querySelectorAll('#panel header [data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderPanel();});
panel.querySelector('.x').onclick=()=>panel.classList.remove('open');
document.querySelectorAll('.supbtn').forEach(b=>b.onclick=()=>{tab='sup';panel.classList.add('open');renderPanel();});
const grid=document.getElementById('grid');
grid.innerHTML=slides.map((s,k)=>{const t=(s.querySelector('h1,h2,.situation')||s).textContent.trim().slice(0,40);
  return `<button data-k="${k}" class="${SIDE[k].sup?'has':''}"><b>${slides[k].dataset.label}</b>${t}</button>`}).join('');
grid.onclick=e=>{const b=e.target.closest('button');if(b){show(+b.dataset.k);grid.classList.remove('open');}};
function full(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
bPrev.onclick=()=>show(cur-1);bNext.onclick=()=>show(cur+1);bGrid.onclick=()=>grid.classList.toggle('open');
bSup.onclick=()=>openPanel('sup');bNotes.onclick=()=>openPanel('notes');bFull.onclick=full;
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;
  const k=e.key;if(['ArrowRight','PageDown',' ','Enter'].includes(k)){e.preventDefault();show(cur+1);}
  else if(['ArrowLeft','PageUp','Backspace'].includes(k)){e.preventDefault();show(cur-1);}
  else if(k==='Home')show(0);else if(k==='End')show(slides.length-1);
  else if(k==='o'||k==='O')grid.classList.toggle('open');else if(k==='s'||k==='S')openPanel('sup');
  else if(k==='n'||k==='N')openPanel('notes');else if(k==='q'||k==='Q')toggleQR();else if(k==='t'||k==='T')tp.classList.toggle('open');else if(k==='f'||k==='F')full();
  else if(k==='Escape'){grid.classList.remove('open');panel.classList.remove('open');qrModal.classList.remove('open');tp.classList.remove('open');up.classList.remove('open');}});
let tx=null;addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(tx===null||panel.contains(e.target))return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1));tx=null;});

// ===== QR 彈窗 =====
const qrModal=document.getElementById('qrModal');
function toggleQR(){qrModal.classList.toggle('open');}
qrModal.onclick=()=>qrModal.classList.remove('open');
bQR.onclick=toggleQR;
// ===== 倒數計時（以結束時刻計算，換頁、切換分頁都不影響） =====
const tp=document.getElementById('timerPanel'), badge=document.getElementById('timerBadge'), tLeft=document.getElementById('tLeft'), tBar=document.getElementById('tBar'), glow=document.getElementById('edgeGlow'), up=document.getElementById('timesUp');
let tEnd=0, tTotal=0, tRemainPaused=null, tTimer=null, lastSec=-1, actx=null;
function ac(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx;}
function beep(f,dur,vol,type='sine',when=0){const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,c.currentTime+when);g.gain.exponentialRampToValueAtTime(vol,c.currentTime+when+0.01);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+when+dur);o.connect(g).connect(c.destination);o.start(c.currentTime+when);o.stop(c.currentTime+when+dur+0.05);}
function tick(sec){if(!tTick.checked)return; if(sec<=10&&tWarnSnd.checked){beep(sec%2?880:1175,0.12,0.25,'triangle');}else{beep(sec%2?1000:800,0.04,0.08,'square');}}
function warnMelody(){if(!tWarnSnd.checked)return;[659,784,880].forEach((f,i)=>beep(f,0.18,0.22,'triangle',i*0.16));}
function finale(){[523,659,784,1047,784,1047].forEach((f,i)=>beep(f,0.28,0.3,'triangle',i*0.22));}
const fmt=s=>{s=Math.max(0,Math.ceil(s));const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');};
function remain(){return tRemainPaused!==null?tRemainPaused:(tEnd-Date.now())/1000;}
function paint(){const r=remain(),sec=Math.ceil(r);tLeft.textContent=fmt(r);tBar.style.width=(tTotal?Math.max(0,r/tTotal*100):0)+'%';
  badge.classList.toggle('warn',sec<=60&&sec>10);badge.classList.toggle('danger',sec<=10&&sec>0);glow.classList.toggle('on',sec<=10&&sec>0&&tRemainPaused===null);
  badge.classList.toggle('paused',tRemainPaused!==null);
  if(tRemainPaused===null&&sec!==lastSec){if(lastSec>0){ if(sec===10)warnMelody(); if(sec>0)tick(sec);} lastSec=sec;}
  if(tRemainPaused===null&&r<=0){stopTimer(false);up.classList.add('open');finale();}}
function startTimer(total){ac();tTotal=total;tEnd=Date.now()+total*1000;tRemainPaused=null;lastSec=Math.ceil(total);badge.classList.add('show');clearInterval(tTimer);tTimer=setInterval(paint,100);paint();tp.classList.remove('open');}
function stopTimer(hide=true){clearInterval(tTimer);tTimer=null;glow.classList.remove('on');badge.classList.remove('warn','danger');if(hide){badge.classList.remove('show');tRemainPaused=null;}else{tLeft.textContent='00:00';tBar.style.width='0%';}}
tStart.onclick=()=>{const t=(+tMin.value||0)*60+(+tSec.value||0);if(t>0)startTimer(t);};
tp.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const t=+b.dataset.p;tMin.value=Math.floor(t/60);tSec.value=t%60;startTimer(t);});
tPause.onclick=()=>{if(!tTimer&&tRemainPaused===null)return;if(tRemainPaused===null){tRemainPaused=remain();}else{tEnd=Date.now()+tRemainPaused*1000;tRemainPaused=null;lastSec=Math.ceil(remain());}paint();};
tAdd.onclick=()=>{if(tRemainPaused!==null){tRemainPaused+=60;}else if(tTimer){tEnd+=60000;}else return;tTotal+=60;lastSec=Math.ceil(remain());paint();};
tReset.onclick=()=>{stopTimer(true);tp.classList.remove('open');};
badge.onclick=()=>tp.classList.toggle('open');
up.onclick=()=>{up.classList.remove('open');badge.classList.remove('show');};
bTimer.onclick=()=>tp.classList.toggle('open');
tp.addEventListener('keydown',e=>e.stopPropagation());
addEventListener('resize',fit);fit();
const m=decodeURIComponent(location.hash).match(/^#p(.+)$/);const k0=m?slides.findIndex(s=>s.dataset.label===m[1]):0;show(k0<0?0:k0);
</script>
</body>
</html>
